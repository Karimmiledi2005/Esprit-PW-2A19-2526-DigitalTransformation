<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agences Protex - Localisation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --ptx-orange: #FF6B1A;
            --ptx-navy: #1A3A7A;
            --ptx-dark: #0a0f1e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--ptx-dark);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--ptx-orange);
            text-decoration: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background: rgba(10, 15, 30, 0.95);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .search-box {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--ptx-orange);
        }

        .agency-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .agency-card {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .agency-card:hover {
            background: rgba(255,255,255,0.07);
            transform: translateY(-2px);
        }

        .agency-card.active {
            background: rgba(255, 107, 26, 0.1);
            border-color: var(--ptx-orange);
        }

        .agency-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 6px;
            color: #fff;
        }

        .agency-info {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .agency-info i {
            color: var(--ptx-orange);
        }

        #map {
            flex: 1;
            z-index: 1;
        }

        /* Leaflet Dark Mode Filter */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .leaflet-container {
            background: #0a0f1e !important;
        }

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .marker-pin {
            width: 30px;
            height: 30px;
            border-radius: 50% 50% 50% 0;
            background: var(--ptx-orange);
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -15px 0 0 -15px;
            box-shadow: 0 0 10px rgba(255, 107, 26, 0.5);
        }

        .marker-pin::after {
            content: '';
            width: 14px;
            height: 14px;
            margin: 8px 0 0 8px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
        }

        .leaflet-popup-content-wrapper {
            background: #1A3A7A;
            color: #fff;
            border-radius: 12px;
        }

        .leaflet-popup-tip {
            background: #1A3A7A;
        }

        .btn-back {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .btn-back:hover {
            opacity: 1;
            color: var(--ptx-orange);
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="client.html" class="btn-back">
            <i class="bi bi-arrow-left"></i> Retour au tableau de bord
        </a>
        <a href="#" class="logo">Protex Agences</a>
        <div style="width: 100px;"></div> <!-- Spacer -->
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="search" class="search-input" placeholder="Rechercher une agence ou ville...">
            </div>
            <div class="agency-list" id="list">
                <!-- List items will be injected here -->
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const agencies = [
            { id: 1, name: "Protex Tunis - Siège", address: "Av. Habib Bourguiba, Tunis", phone: "+216 71 000 111", lat: 36.8065, lng: 10.1815 },
            { id: 2, name: "Protex Sousse", address: "Av. 14 Janvier, Sousse", phone: "+216 73 222 333", lat: 35.8256, lng: 10.6369 },
            { id: 3, name: "Protex Sfax", address: "Route de Teniour, Sfax", phone: "+216 74 444 555", lat: 34.7406, lng: 10.7603 },
            { id: 4, name: "Protex Bizerte", address: "Quai d'Honneur, Bizerte", phone: "+216 72 333 444", lat: 37.2744, lng: 9.8739 },
            { id: 5, name: "Protex Hammamet", address: "Zone Touristique, Hammamet", phone: "+216 72 555 666", lat: 36.4, lng: 10.6167 }
        ];

        // Init Map
        const map = L.map('map').setView([35.6759, 10.1005], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markers = {};

        function renderList(filter = '') {
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            
            agencies.forEach(agency => {
                if (filter && !agency.name.toLowerCase().includes(filter.toLowerCase()) && !agency.address.toLowerCase().includes(filter.toLowerCase())) {
                    return;
                }

                const card = document.createElement('div');
                card.className = 'agency-card';
                card.id = `agency-${agency.id}`;
                card.innerHTML = `
                    <div class="agency-name">${agency.name}</div>
                    <div class="agency-info"><i class="bi bi-geo-alt"></i> ${agency.address}</div>
                    <div class="agency-info"><i class="bi bi-telephone"></i> ${agency.phone}</div>
                `;
                
                card.onclick = () => {
                    focusAgency(agency);
                };
                
                listEl.appendChild(card);

                // Add Marker if not already added
                if (!markers[agency.id]) {
                    const marker = L.marker([agency.lat, agency.lng]).addTo(map);
                    marker.bindPopup(`<strong>${agency.name}</strong><br>${agency.address}`);
                    marker.on('click', () => {
                        document.querySelectorAll('.agency-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    });
                    markers[agency.id] = marker;
                }
            });
        }

        function focusAgency(agency) {
            map.flyTo([agency.lat, agency.lng], 15);
            markers[agency.id].openPopup();
            
            document.querySelectorAll('.agency-card').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`agency-${agency.id}`);
            if (card) card.classList.add('active');
        }

        document.getElementById('search').oninput = (e) => {
            renderList(e.target.value);
        };

        renderList();
    </script>
</body>
</html>
