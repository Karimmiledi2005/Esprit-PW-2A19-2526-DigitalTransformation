/* ── Fraud Badge (inline dans tableau sinistres) ── */

.fraud-badge.moyen    { background: rgba(244,162,97,0.15);  color: #f4a261; border: 1px solid rgba(244,162,97,0.3); }
.fraud-badge.eleve    { background: rgba(230,57,70,0.15);   color: #e63946; border: 1px solid rgba(230,57,70,0.3); }

<!-- ══════════════ JAVASCRIPT À AJOUTER EN BAS DU BODY ══════════════ -->
<script id="antifraud-script">
// ── Antifraud panel logic ──────────────────────────────────────────────────

const FRAUD_GET_API     = 'fraud_get.php';
const FRAUD_ANALYSE_API = 'fraud_analyse.php';

let currentFraudSinistreId = null;

// Appelé depuis openViewModal() après chargement du sinistre
async function loadFraudPanel(sinistreId) {
  currentFraudSinistreId = sinistreId;
  setFraudState('loading');

  try {
    const res  = await fetch(FRAUD_GET_API + '?id_sinistre=' + sinistreId + '&_=' + Date.now());
    const json = await res.json();

    if (json.success && json.data) {
      renderFraudPanel(json.data);
    } else {
      setFraudState('empty');
    }
  } catch (e) {
    setFraudState('empty');
  }
}

// Relancer / première analyse
async function reanalyserFraud() {
  if (!currentFraudSinistreId) return;
  setFraudState('loading');

  const btn = document.getElementById('fraudReanalyseBtn');
  if (btn) { btn.classList.add('loading'); btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Analyse…'; }

  try {
    const res  = await fetch(FRAUD_ANALYSE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'id_sinistre=' + currentFraudSinistreId
    });
    const json = await res.json();

    if (json.success && json.data) {
      renderFraudPanel(json.data);
      showToast('Analyse antifraud mise à jour.', 'success');
    } else {
      setFraudState('empty');
      showToast('Échec de l\'analyse IA.', 'danger');
    }
  } catch (e) {
    setFraudState('empty');
    showToast('Erreur réseau lors de l\'analyse.', 'danger');
  } finally {
    if (btn) { btn.classList.remove('loading'); btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Relancer l\'analyse'; }
  }
}

function renderFraudPanel(d) {
  // Visibilité
  document.getElementById('fraudPanel').style.display   = 'block';
  document.getElementById('fraudLoading').style.display = 'none';
  document.getElementById('fraudEmpty').style.display   = 'none';

  // Score circle
  const score  = d.score_global  || 0;
  const niveau = d.niveau_risque || 'faible';
  const circle = document.getElementById('fraudCircle');
  circle.className = 'fraud-score-circle ' + niveau;
  document.getElementById('fraudScoreNum').textContent = score;

  // Niveau label
  const niveauLabels = { faible:'Risque Faible', moyen:'Risque Modéré', eleve:'Risque Élevé', critique:'RISQUE CRITIQUE' };
  const niveauEl = document.getElementById('fraudNiveauLabel');
  niveauEl.textContent  = niveauLabels[niveau] || niveau;
  niveauEl.className    = 'niveau-label ' + niveau;

  // Suggestion pill
  const pillIcons = { accepter:'✅', investiguer:'🔍', refuser:'❌' };
  const pillLabels = { accepter:'Suggérer : Accepter', investiguer:'Suggérer : Investiguer', refuser:'Suggérer : Refuser' };
  const sugg = d.suggestion_ia || 'investiguer';
  document.getElementById('fraudSuggestionPill').innerHTML =
    '<span class="suggestion-pill ' + sugg + '">' + (pillIcons[sugg]||'') + ' ' + (pillLabels[sugg]||sugg) + '</span>';

  // Sous-scores
  const scores = d.scores_detail || {};
  const fillBar = (barId, valId, val) => {
    val = val || 0;
    document.getElementById(barId).style.width = val + '%';
    document.getElementById(valId).textContent = val + '/100';
  };
  fillBar('barTexte',   'barTexteVal',   scores.texte);
  fillBar('barComport', 'barComportVal', scores.comportement);
  fillBar('barContrat', 'barContratVal', scores.contrat);

  // Flags
  const flagDefs = [
    { key: 'description_vague',   label: 'Description vague',     icon: 'bi-chat-x' },
    { key: 'sinistres_multiples', label: 'Sinistres multiples',   icon: 'bi-exclamation-diamond' },
    { key: 'contrat_recent',      label: 'Contrat récent',        icon: 'bi-calendar-x' },
    { key: 'montant_eleve',       label: 'Franchise élevée',      icon: 'bi-cash-stack' },
    { key: 'image_suspecte',      label: 'Image suspecte',        icon: 'bi-image-alt' },
  ];
  const flags = d.flags || {};
  document.getElementById('fraudFlags').innerHTML = flagDefs.map(f => {
    const active = !!flags[f.key];
    return '<span class="fraud-flag ' + (active ? 'active' : 'inactive') + '">' +
      '<i class="bi ' + f.icon + '"></i>' + f.label + '</span>';
  }).join('');

  // Recommandation
  const recEl = document.getElementById('fraudRecommandation');
  if (d.recommandation) {
    recEl.style.display = 'block';
    recEl.textContent   = d.recommandation;
  } else {
    recEl.style.display = 'none';
  }

  // Date analyse
  if (d.date_analyse) {
    const dt = new Date(d.date_analyse);
    document.getElementById('fraudAnalyseDate').textContent =
      '· Analysé le ' + dt.toLocaleDateString('fr-FR') + ' à ' + dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
}

function setFraudState(state) {
  document.getElementById('fraudPanel').style.display   = state === 'panel'   ? 'block' : 'none';
  document.getElementById('fraudLoading').style.display = state === 'loading' ? 'block' : 'none';
  document.getElementById('fraudEmpty').style.display   = state === 'empty'   ? 'block' : 'none';
}

// ── Badge inline pour tableau sinistres ────────────────────────────────────
// Utilisation : renderFraudBadge(row.fraud_score, row.fraud_niveau)
function renderFraudBadge(score, niveau) {
  if (score === null || score === undefined || !niveau) {
    return '<span class="fraud-badge none"><i class="bi bi-shield"></i> N/A</span>';
  }
  const icons = { faible:'bi-shield-check', moyen:'bi-shield-exclamation', eleve:'bi-shield-x', critique:'bi-shield-fill' };
  const labels = { faible:'Faible', moyen:'Modéré', eleve:'Élevé', critique:'CRITIQUE' };
  return '<span class="fraud-badge ' + niveau + '"><i class="bi ' + (icons[niveau]||'bi-shield') + '"></i>' +
    (labels[niveau]||niveau) + ' · ' + score + '</span>';
}
</script>
